# Fresh current-architecture control under the reference optimizer/objective.
# Architecture ablations copy this complete recipe and change one mechanism.
experiment_name: mswr_assessment_no_wavelet
model_size: base
gpu_id: "0"
batch_size: 20
patch_size: 128
stride: 8
cache_dtype: float32
end_epoch: 300
steps_per_epoch: 1000
num_workers: 4
pin_memory: true
save_frequency: 5000
validate_frequency: 1000
mrae_diagnostics: true
seed: 42
attention_type: dual
use_flash_attn: true
use_spectral_attn: true
spectral_attn_heads: 1
spectral_ffn: true
spectral_ffn_mult: 2
multistage_refine: true
refine_hidden: 64
spectral_prelayer: false
spectral_output_block: true
spectral_output_gate_init: 1.0e-2
blocks_per_stage: 1
landmark_pooling: learned_content
use_wavelet: false
wavelet_type: db2
wavelet_levels: [1, 1, 1]
wavelet_detail_processing: true
wavelet_detail_gain_mode: identity
norm_type: layer
conv_norm_type: none
layer_scale_init: 1.0e-4
residual_gate_init: 0.0
drop_path: 0.1
dropout: 0.0
attention_dropout: 0.0
use_enhanced_loss: false
# Unfloored positive-target objective; zeros fail loudly.
mrae_epsilon: 0.0
validation_clamp_output: false
validation_crop_border: 128
optimizer: adam
scheduler: cosine
init_lr: 4.0e-4
min_lr: 1.0e-6
warmup_epochs: 0
weight_decay: 0.0
gradient_clip: 0.0
gradient_accumulation_steps: 1
use_amp: false
channels_last: false
memory_monitoring: true
use_ema: false
early_stopping_mode: "off"
