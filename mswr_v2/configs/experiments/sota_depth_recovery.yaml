# ============================================================================
# MSWR-Net v2.1.2 - fresh depth/prelayer recovery experiment
# ============================================================================
#
# The prior Rung-3 recipe (sota_spectral_depth.yaml) stalled around train 0.78
# / validation 0.69 MRAE. Its outer ReZero gates and 1e-4 LayerScale left the
# added prelayer, spectral FFN, and refinement internals with zero or tiny first
# step gradients. This recovery is a FRESH RUN ONLY: it starts those newly
# stacked branches at 1e-2, retains identity-centred wavelet detail gains, and
# uses input-conditioned landmarks. Do not resume a legacy or failed Rung-3
# checkpoint with it.
#
# Gate telemetry is logged every epoch. Stop and inspect the run if training
# MRAE is still above 0.6 and flat by epoch 8; a healthy recovery should leave
# the old linear-head regime well before then.
# ============================================================================

experiment_name: mswr_v212_sota_depth_recovery
model_size: base
gpu_id: "0"

# ---- data / iteration ----
batch_size: 20
patch_size: 128
stride: 8
end_epoch: 300
steps_per_epoch: 1000
num_workers: 4
pin_memory: true
save_frequency: 5000
validate_frequency: 1000
mrae_diagnostics: true
seed: 42

# ---- architecture: recovered Rung-3 stack (fresh initialization required) ----
attention_type: dual
use_flash_attn: true
use_spectral_attn: true
spectral_attn_heads: 1
spectral_ffn: true
spectral_ffn_mult: 2
multistage_refine: true
refine_hidden: 64
spectral_prelayer: true
blocks_per_stage: 2
landmark_pooling: learned_content
use_wavelet: true
wavelet_type: db2
wavelet_levels: [1, 1, 1]
wavelet_detail_processing: true
wavelet_detail_gain_mode: identity
norm_type: layer
conv_norm_type: none
# Deliberately nonzero only for the fresh, deeply stacked recovery recipe.
layer_scale_init: 1.0e-2
residual_gate_init: 1.0e-2

# ---- data cache / objective ----
cache_dtype: float32
use_enhanced_loss: false

# ---- optimizer / schedule ----
optimizer: adamw
scheduler: cosine
init_lr: 4.0e-4
min_lr: 1.0e-6
warmup_epochs: 5
weight_decay: 1.0e-2
gradient_clip: 1.0
gradient_accumulation_steps: 1

# ---- regularization / runtime ----
drop_path: 0.15
attention_dropout: 0.02
use_amp: true
amp_dtype: auto
channels_last: true
memory_monitoring: true
use_checkpoint: true

# ---- model selection ----
use_ema: true
ema_decay: 0.999
ema_start_epoch: 5
ema_eval_mode: both
selection_source: auto
early_stopping_mode: "off"
