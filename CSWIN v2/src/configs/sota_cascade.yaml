defaults:
  - config
  - _self_

# ============================================================================
# Residual-balanced recovery recipe. FRESH RUN ONLY.
#
# The filename is retained for command compatibility; this is deliberately not
# a three-stage cascade. A 2026-07-23 local/global run using the previous
# "recovery" recipe started at train MRAE 93.5 and plateaued at validation MRAE
# 0.66 / PSNR 19.1 from roughly 10k through 37k iterations. The generator was
# updating, but its random Kaiming-scale output projection amplified the
# residual-heavy decoder. MRAE then drove the projection toward a low-output
# median before the body learned a useful RGB-to-spectrum mapping.
#
# The base config now scales the final projection by 0.01. This recipe also
# enables the already-implemented shallow RGB-to-HSI prior so training starts
# near the well-conditioned zero-prediction MRAE baseline (~1) and has a direct
# radiometric gradient path.
#
# Two subsequent runs with the 0.01-scaled output head reached only 0.5233 and
# 0.5246 MRAE. Disabling all legacy normalization/denoising paths did not move
# the optimum. A gradient probe explains the plateau: the tiny head made the
# bottleneck gradient ~56,000x smaller than the head gradient, so the shallow
# RGB skip learned while the transformer body was effectively starved.
#
# The June control run reached 0.2737 MRAE / 29.56 dB with a normally scaled
# head and a 70k cosine horizon (LR ~1.8e-6 by 68k). The later 300k horizon was
# still applying a large LR when validation began regressing. This recipe keeps
# fresh activations bounded with a 0.1 residual-in-residual scale, restores the
# full-gradient output head, and restores the empirically successful 70k
# schedule. Exact MRAE is reached late in that decaying-LR schedule.
#
# Do not resume either failed July checkpoint bundle. Enabling the spectral
# prior adds parameters, and initialization changes only take effect on a fresh
# model. The separate output directories prevent accidental checkpoint mixing.
# ============================================================================

base_channels: 48
cswin_attention_mode: local_global
split_sizes: [7, 7, 7]
stage_num_heads: null
cswin_global_tokens: 1024
use_feature_norm: false
use_input_denoising: false
smsa_output_norm: false
cascade_stages: 1
thick_output_head: false
sstb_outer_residual_scale: 0.1
output_head_init_scale: 1.0
use_spectral_input_skip: true
refinement_blocks: 0

objective: mrae_annealed
mrae_epsilon: 1.0e-2
mrae_epsilon_start: 1.0e-2
mrae_epsilon_end: 1.0e-8
mrae_epsilon_anneal_iters: 50000

progressive_stages:
  - {patch_size: 128, iterations: 70000, init_lr: 4.0e-4, batch_size: 20, warmup_steps: 1000}

early_stopping_patience: 8
early_stopping_min_delta: 5.0e-5
early_stopping_warmup_epochs: 50
early_stopping_final_stage_only: true

log_dir: ${oc.env:HSI_LOG_DIR,./artifacts/logs}/sota_residual_balanced
checkpoint_dir: ${oc.env:HSI_CKPT_DIR,./artifacts/checkpoints}/sota_residual_balanced
