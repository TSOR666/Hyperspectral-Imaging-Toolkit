defaults:
  - config
  - _self_

# ============================================================================
# SOTA recovery/push recipe. FRESH RUN ONLY (module set differs from older
# checkpoints).
#
# Rationale (2026-07 architecture review after train_generator 8.log):
#   The failed run forced cswin_attention_mode=axial and plateaued at
#   ValMRAE 0.560568 by iter 79k. The repo's own axial ablation note predicts
#   exactly this 0.5-0.6 regime, while the local_global baseline was around
#   0.24-0.27. So this recipe first removes the known-bad axial path, then adds
#   real capacity where MRAE/PSNR need it:
#
#   1. cswin_attention_mode: local_global - recover the validated bounded
#      window + global-bottleneck spatial path.
#   2. smsa_output_norm: false - remove the non-standard GroupNorm after the
#      S-MSA projection. GN subtracts per-group spatial means inside the
#      residual branch, stripping exactly the low-frequency intensity
#      corrections MRAE/PSNR need (SAM is scale-invariant, hence unaffected).
#      Restormer-MDTA / MST++ end the branch at the projection.
#   3. use_spectral_input_skip: true - give the model a direct RGB->HSI
#      spectral prior so the transformer body learns residual spectral detail
#      instead of the whole color-to-spectrum lift.
#   4. refinement_blocks: 2 - cheap RGB-conditioned output-space residual
#      correction blocks. The final convs are zero-init, so the blocks start as
#      exact identities but their last layers receive gradients immediately.
#   5. base_channels: 64 - recovers moderate capacity while staying far below
#      the old 96-channel/44.8M overfit run; compute is offset by disabling the
#      expensive full-body cascade.
#
# Loss/protocol unchanged: annealed pure-MRAE, Adam 4e-4, 300k cosine,
# patch 128 / stride 8, EMA, center-crop 226x256 validation.
# ============================================================================

base_channels: 64
cswin_attention_mode: local_global
cascade_stages: 1
smsa_output_norm: false
thick_output_head: true
use_spectral_input_skip: true
spectral_input_skip_init: 0.03
refinement_blocks: 2
refinement_channels: 64
refinement_ffn_expansion: 2.0

log_dir: ${oc.env:HSI_LOG_DIR,./artifacts/logs}/sota_cascade
checkpoint_dir: ${oc.env:HSI_CKPT_DIR,./artifacts/checkpoints}/sota_cascade
