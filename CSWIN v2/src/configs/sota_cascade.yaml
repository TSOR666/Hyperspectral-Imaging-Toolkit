defaults:
  - config
  - _self_

# ============================================================================
# Validated recovery recipe. FRESH RUN ONLY.
#
# The filename is retained for command compatibility, but this is deliberately
# no longer a three-stage cascade. The 2026-07-21 run of the experimental
# base=64 / true-CSWin / cascade=3 bundle plateaued at ValMRAE ~= 0.63 and
# PSNR ~= 19.3 from roughly 12k through 25k iterations. Training was finite,
# unclamped and OOM-free at batch 20, so the result is architectural
# underfitting rather than a CUDA, validation-clamping, or numerical issue.
#
# This recipe explicitly pins the repository's known-good local/global model
# instead of inheriting experimental architecture switches. It retains the
# MST++ training protocol from config.yaml, including batch_size=20, annealed
# MRAE, 128x128 patches, Adam at 4e-4, EMA, and the 300k cosine schedule.
#
# Do not resume a checkpoint from the failed sota_cascade run: the model shapes
# and computation graph are incompatible. The separate output directories
# below make accidental checkpoint mixing less likely.
# ============================================================================

base_channels: 48
cswin_attention_mode: local_global
split_sizes: [7, 7, 7]
stage_num_heads: null
cswin_global_tokens: 1024
use_feature_norm: true
use_input_denoising: true
smsa_output_norm: true
cascade_stages: 1
thick_output_head: false
use_spectral_input_skip: false
refinement_blocks: 0

log_dir: ${oc.env:HSI_LOG_DIR,./artifacts/logs}/sota_recovery_local_global
checkpoint_dir: ${oc.env:HSI_CKPT_DIR,./artifacts/checkpoints}/sota_recovery_local_global
