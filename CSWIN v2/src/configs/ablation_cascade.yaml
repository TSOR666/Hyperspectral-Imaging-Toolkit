# ============================================================================
# ABLATION: weight-tied cascade refinement ONLY. FRESH RUN.
#
# Changes ONLY cascade_stages vs config.yaml (attention mode stays
# local_global, smsa_output_norm stays true). Low-priority insurance: the
# cascade is provably identity AND zero-gradient-to-shared-weights at init
# (zero-init feedback conv + zero-init per-channel gate, generator_v3.py
# ~L546-551,682-685), so it cannot cause the early underfit. This run confirms
# it also does not hurt via late-training gradient interference between the two
# weight-tied passes.
#
# EXPECTED: reaches ~0.24, matching the single-pass baseline (the refinement
# only helps if the gate learns to open). NOTE: this DOUBLES per-iter compute
# (the U-Net body runs twice) for an uncertain gain -- lowest priority of the
# three ablations.
# ============================================================================

cascade_stages: 2

log_dir: ${oc.env:HSI_LOG_DIR,./artifacts/logs}/ablation_cascade
checkpoint_dir: ${oc.env:HSI_CKPT_DIR,./artifacts/checkpoints}/ablation_cascade
